services:
  app:
    build: .
    env_file:
      - path: .env
        required: false  # le conteneur démarre même sans .env (ex. tests, CI)
    environment:
      # le LLM tourne dans le service « ollama » ci-dessous, joignable par son nom
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - ollama

  # LLM local. Pas de « ports » : seul le conteneur app en a besoin, et cela évite un conflit
  # avec un Ollama déjà lancé sur la machine (port 11434).
  # GPU NVIDIA : ajouter  -f docker-compose.gpu.yml  à la commande (voir README).
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
